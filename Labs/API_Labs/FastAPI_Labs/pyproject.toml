[project]
name = "fastapi-wine-lab"
version = "0.1.0"
description = "Custom FastAPI lab with Wine dataset and Random Forest model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi[all]==0.111.1",
  "joblib==1.4.2",
  "scikit-learn==1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
